server:
  port: 8787
  address: 127.0.0.1

spring:
  application:
    name: es-lab
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      # 前端构建产物由 WebConfig 从 front/dist 动态映射，这里只保留 classpath 兜底
      static-locations: classpath:/static/
  mvc:
    # 关掉默认的静态资源映射，避免和 WebConfig 里的 front/dist 映射冲突
    throw-exception-if-no-handler-found: false

eslab:
  # 后端端口。独立于 server.port，避免被环境变量 SERVER__PORT 之类的宽松绑定污染
  port: 8787
  # 本地 Elasticsearch；只读复用，不改它的任何配置
  es-url: http://127.0.0.1:9200
  # 仓库根目录。后端是 backend/ 下的独立项目，运行时需要跨出去读两样东西：
  #   front/dist      —— 前端构建产物（WebConfig 托管）
  #   backend/src/... —— 关卡源码回读
  # sh/ 下的脚本都会显式导出 ESLAB_ROOT；直接 java -jar 时才回落到 user.dir
  root: ${ESLAB_ROOT:${user.dir}}
  # 日志里不打印完整查询体，避免刷屏
  log-bodies: false

logging:
  level:
    root: INFO
    com.eslab: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
